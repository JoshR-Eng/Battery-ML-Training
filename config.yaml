# config.yaml

# -----------------------------------------------------------
#                     Experimental Control
# -----------------------------------------------------------

experiment_name: "LSTM_Baseline_01"
output_dir: "./results"
device: "auto"      # ( cuda / cpu / auto )

mode: "train-eval"  # ( train / eval / train-eval)
model: "LSTM"       # ( LSTM / TCN )



# -----------------------------------------------------------
#                           Dataset
# -----------------------------------------------------------

data:
  dir: "../data/tensors_qv"
  batch_size: 32
  num_workers: 4
  nominal_capacity: 2.4



# -----------------------------------------------------------
#                     Machine Learning Models
# -----------------------------------------------------------

models:

  LSTM:
    input_size: 1
    hidden_size: 64
    num_layers: 2
    dropout: 0.1
    output_size: 1
    learning_rate: 0.001
    epochs: 200

  TCN:
    
