# config.yaml

# -----------------------------------------------------------
#                     Experimental Control
# -----------------------------------------------------------

experiment_name: "01/GRU"
output_dir: "./results"
device: "auto"      # ( cuda / cpu / auto )

mode: "train-eval"  # ( train / eval / train-eval)
model: "GRU"



# -----------------------------------------------------------
#                           Dataset
# -----------------------------------------------------------

data:
  dir: "./data/tensors_qv"
  batch_size: 32
  num_workers: 4
  nominal_capacity: 2.4

export:
  batch_size: [1, 32]

# -----------------------------------------------------------
#                     Machine Learning Models
# -----------------------------------------------------------

models:

  # ------------------------- LSTM --------------------------
  LSTM:
    input_size: 1
    hidden_size: 64
    num_layers: 2
    dropout: 0.1
    output_size: 1
    learning_rate: 0.001
    epochs: 150

  CNN-LSTM:
    input_size: 1
    cnn_channels: [16, 32, 64]      # Progressive feature extraction
    kernel_size: 5                   # Captures 5 voltage points at once
    lstm_hidden_size: 64
    lstm_layers: 2
    output_size: 1
    dropout: 0.2
    learning_rate: 0.001
    epochs: 150


  # ------------------------- GRU ---------------------------
  GRU:
    input_size: 1
    hidden_size: 64
    num_layers: 2
    dropout: 0.1
    output_size: 1
    learning_rate: 0.001
    epochs: 150
  
  CNN-GRU:
    input_size: 1
    cnn_channels: [16, 32, 64]      # Same as CNN-LSTM
    kernel_size: 5
    gru_hidden_size: 64
    gru_layers: 2
    output_size: 1
    dropout: 0.2
    learning_rate: 0.001
    epochs: 150


  # ------------------------- TCN ---------------------------
  TCN:
    input_size: 1
    hidden_size: 64
    output_size: 1
    kernel_size: 5
    dropout: 0.1
    learning_rate: 0.001
    epochs: 150
  
   
  
